<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitStop · Cantina CESAR</title>
  <link rel="icon" type="image/svg+xml" href="/static/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: { DEFAULT: '#FACC15', soft: '#FEF9C3', dark: '#CA8A04' },
            ink: '#0A0A0A',
          },
          boxShadow: {
            card: '0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04)',
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .fade-in { animation: fadeIn .18s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    @keyframes tvGlow {
      0%, 100% { box-shadow: 0 0 20px rgba(250, 204, 21, 0.25); }
      50% { box-shadow: 0 0 35px rgba(250, 204, 21, 0.55); }
    }
    .tv-glow { animation: tvGlow 2s infinite ease-in-out; }
    @keyframes subtleBlink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.35; }
    }
    .blink-dot { animation: subtleBlink 1.4s infinite; }
    @keyframes slideDownAlert {
      0% { transform: translateY(-120%); opacity: 0; }
      70% { transform: translateY(4px); opacity: 1; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .slide-down-alert { animation: slideDownAlert 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    /* Golden Yellow Gradient ("Tcham") across all yellow backgrounds & accents */
    .bg-amber-400, .bg-brand {
      background-image: linear-gradient(135deg, #FDE047 0%, #FBBF24 50%, #F59E0B 100%) !important;
    }
    .bg-amber-500 {
      background-image: linear-gradient(135deg, #FBBF24 0%, #F59E0B 55%, #D97706 100%) !important;
    }
    .hover\:bg-amber-300:hover, .hover\:bg-amber-400:hover {
      background-image: linear-gradient(135deg, #FEF08A 0%, #FDE047 50%, #FBBF24 100%) !important;
    }
    .text-amber-gradient {
      display: inline-block;
      padding: 0.08em 0.18em 0.08em 0.02em;
      margin: -0.08em -0.18em -0.08em -0.02em;
      background: linear-gradient(135deg, #FDE047 0%, #FBBF24 50%, #F59E0B 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
    .text-amber-gradient-dark {
      display: inline-block;
      padding: 0.08em 0.18em 0.08em 0.02em;
      margin: -0.08em -0.18em -0.08em -0.02em;
      background: linear-gradient(135deg, #F59E0B 0%, #D97706 50%, #B45309 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
    }
  </style>
</head>
<body class="bg-[#F8F9FA] text-neutral-900 min-h-screen">
  <div id="app-root"></div>
  <script src="/static/app.js"></script>
</body>
</html>
